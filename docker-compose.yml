version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: loceasy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loceasy
      POSTGRES_PASSWORD: loceasy
      POSTGRES_DB: loceasy
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loceasy -d loceasy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
